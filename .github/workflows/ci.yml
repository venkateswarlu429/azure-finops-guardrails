name: ci

on:
  push:
  pull_request:

jobs:
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Format check
        run: terraform fmt -check -recursive
      - name: Validate modules and example
        run: |
          for dir in modules/budgets modules/policy modules/cost-export environments/dev; do
            echo "--- $dir ---"
            (cd "$dir" && terraform init -backend=false -input=false && terraform validate)
          done

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax check
        run: python3 -m py_compile scripts/cost_report.py
